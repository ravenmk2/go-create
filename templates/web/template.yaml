name: web
description: "Server application: HTTP service (net/http / chi / gin / echo) with optional frontend embed, SQLite, GHCR image, and goreleaser release"

options:
  - key: display_name
    type: string
    prompt: "Project title (friendly display name)"
  - key: description
    type: string
    prompt: "One-line project description"
  - key: http_framework
    type: choice
    prompt: HTTP framework
    choices:
      - {value: nethttp, label: Standard library net/http}
      - {value: chi, label: chi}
      - {value: gin, label: Gin}
      - {value: echo, label: Echo}
    default: nethttp
  - key: embed_frontend
    type: boolean
    prompt: Embed frontend build output (web/dist, with SPA fallback)
    default: false
  - key: sqlite
    type: boolean
    prompt: Integrate SQLite (automatic CGO / pure-Go driver switching)
    default: false
  - key: docker_image
    type: boolean
    prompt: Publish GHCR container image (via goreleaser; its config is generated automatically)
    default: false
  - key: goreleaser
    type: boolean
    prompt: Generate goreleaser release config (.goreleaser.yml + release.yml)
    default: true
  - key: makefile
    type: boolean
    prompt: Generate Makefile
    default: true
  - key: ci_platforms
    type: multichoice
    prompt: CI test platform matrix
    choices:
      - {value: ubuntu-latest, label: Ubuntu}
      - {value: windows-latest, label: Windows}
      - {value: macos-latest, label: macOS}
    default: [ubuntu-latest, windows-latest, macos-latest]

files:
  - src: go.mod.tpl
    dest: go.mod
    render: true
  - src: cmd/main.go.tpl
    dest: cmd/{{ .Name }}/main.go
    render: true
  - src: internal/server/server_nethttp.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "nethttp"
  - src: internal/server/server_chi.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "chi"
  - src: internal/server/server_gin.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "gin"
  - src: internal/server/server_echo.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "echo"
  - src: internal/server/spa.go.tpl
    dest: internal/server/spa.go
    render: true
    when: embed_frontend
  - src: internal/store/store.go.tpl
    dest: internal/store/store.go
    render: true
    when: sqlite
  - src: internal/store/driver_cgo.go.tpl
    dest: internal/store/driver_cgo.go
    when: sqlite
  - src: internal/store/driver_nocgo.go.tpl
    dest: internal/store/driver_nocgo.go
    when: sqlite
  - src: web/embed.go.tpl
    dest: web/embed.go
    render: true
    when: embed_frontend
  - src: scripts/build.sh.tpl
    dest: scripts/build.sh
    render: true
  - src: Dockerfile.tpl
    dest: Dockerfile
    render: true
    when: docker_image
  - src: .goreleaser.yml.tpl
    dest: .goreleaser.yml
    render: true
    when: goreleaser || docker_image
  - src: .github/workflows/test.yml.tpl
    dest: .github/workflows/test.yml
    render: true
  - src: .github/workflows/release.yml.tpl
    dest: .github/workflows/release.yml
    render: true
    when: goreleaser || docker_image
  - src: Makefile.tpl
    dest: Makefile
    render: true
    when: makefile
  - src: README.md.tpl
    dest: README.md
    render: true
  - src: AGENTS.md.tpl
    dest: AGENTS.md
    render: true
  - src: .gitignore
  - src: .gitattributes
  - src: .ignore
  - src: .golangci.yml

tests:
  - name: minimal
  - name: chi
    set: {http_framework: chi}
  - name: gin
    set: {http_framework: gin}
  - name: echo
    set: {http_framework: echo}
  - name: embed
    set: {embed_frontend: true}
  - name: sqlite
    set: {sqlite: true}
  - name: docker
    set: {docker_image: true, goreleaser: false}
  - name: no-extras
    set:
      goreleaser: false
      makefile: false
      ci_platforms: [ubuntu-latest]
  - name: full
    set:
      display_name: "Test API"
      description: "A test server"
      http_framework: chi
      embed_frontend: true
      sqlite: true
      docker_image: true
      goreleaser: true
      makefile: true
      ci_platforms: [ubuntu-latest, windows-latest, macos-latest]
