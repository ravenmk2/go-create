name: web
description: "Server application: HTTP service (net/http / chi / gin / echo) with optional frontend embed, SQLite, GHCR image, and goreleaser release"

options:
  - key: display_name
    type: string
    prompt: Project title
    help: Friendly display name for the project.
    group: Basic
  - key: description
    type: string
    prompt: Description
    help: A one-line description of the project.
    group: Basic
  - key: http_framework
    type: choice
    prompt: HTTP framework
    group: Basic
    choices:
      - {value: nethttp, label: Standard library net/http}
      - {value: chi, label: chi}
      - {value: gin, label: Gin}
      - {value: echo, label: Echo}
    default: nethttp
  - key: embed_frontend
    type: boolean
    prompt: Embed frontend
    help: Embed web/dist in the binary, with SPA fallback.
    group: Features
    default: false
  - key: sqlite
    type: boolean
    prompt: SQLite
    help: Switch between CGO and pure-Go drivers automatically.
    group: Features
    default: false
  - key: docker_image
    type: boolean
    prompt: Release image
    help: Publish GHCR images via GoReleaser; release config is generated automatically.
    group: Features
    default: false
  - key: goreleaser
    type: boolean
    prompt: GoReleaser
    help: Generate .goreleaser.yml and release.yml.
    group: CI & Release
    default: true
  - key: docker_dev
    type: boolean
    prompt: Development image
    help: Publish GHCR :dev on branch pushes or manual workflow runs.
    group: CI & Release
    default: true
  - key: makefile
    type: boolean
    prompt: Makefile
    help: Generate a Makefile.
    group: CI & Release
    default: true
  - key: ci_platforms
    type: multichoice
    prompt: CI test platforms
    group: CI & Release
    choices:
      - {value: ubuntu-latest, label: Ubuntu}
      - {value: windows-latest, label: Windows}
      - {value: macos-latest, label: macOS}
    default: [ubuntu-latest, windows-latest, macos-latest]

files:
  - src: go.mod.tpl
    dest: go.mod
    render: true
  - src: cmd/main.go.tpl
    dest: cmd/{{ .Name }}/main.go
    render: true
  - src: internal/server/server_nethttp.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "nethttp"
  - src: internal/server/server_chi.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "chi"
  - src: internal/server/server_gin.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "gin"
  - src: internal/server/server_echo.go.tpl
    dest: internal/server/server.go
    render: true
    when: http_framework == "echo"
  - src: internal/server/spa.go.tpl
    dest: internal/server/spa.go
    render: true
    when: embed_frontend
  - src: internal/store/store.go.tpl
    dest: internal/store/store.go
    render: true
    when: sqlite
  - src: internal/store/driver_cgo.go.tpl
    dest: internal/store/driver_cgo.go
    when: sqlite
  - src: internal/store/driver_nocgo.go.tpl
    dest: internal/store/driver_nocgo.go
    when: sqlite
  - src: web/embed.go.tpl
    dest: web/embed.go
    render: true
    when: embed_frontend
  - src: scripts/build.sh.tpl
    dest: scripts/build.sh
    render: true
  - src: scripts/build-web.sh.tpl
    dest: scripts/build-web.sh
    render: true
    when: embed_frontend
  - src: Dockerfile.tpl
    dest: Dockerfile
    render: true
    when: docker_image || docker_dev
  - src: .goreleaser.yml.tpl
    dest: .goreleaser.yml
    render: true
    when: goreleaser || docker_image
  - src: .github/workflows/test.yml.tpl
    dest: .github/workflows/test.yml
    render: true
  - src: .github/workflows/docker-dev.yml.tpl
    dest: .github/workflows/docker-dev.yml
    render: true
    when: docker_dev
  - src: .github/workflows/release.yml.tpl
    dest: .github/workflows/release.yml
    render: true
    when: goreleaser || docker_image
  - src: Makefile.tpl
    dest: Makefile
    render: true
    when: makefile
  - src: README.md.tpl
    dest: README.md
    render: true
  - src: AGENTS.md.tpl
    dest: AGENTS.md
    render: true
  - src: .gitignore
  - src: .gitattributes
  - src: .ignore
  - src: .golangci.yml

tests:
  - name: minimal
  - name: chi
    set: {http_framework: chi}
  - name: gin
    set: {http_framework: gin}
  - name: echo
    set: {http_framework: echo}
  - name: embed
    set: {embed_frontend: true}
  - name: sqlite
    set: {sqlite: true}
  - name: docker
    set: {docker_image: true, docker_dev: false, goreleaser: false}
  - name: docker-dev-only
    set: {goreleaser: false}
  - name: no-extras
    set:
      goreleaser: false
      docker_dev: false
      makefile: false
      ci_platforms: [ubuntu-latest]
  - name: full
    set:
      display_name: "Test API"
      description: "A test server"
      http_framework: chi
      embed_frontend: true
      sqlite: true
      docker_image: true
      docker_dev: true
      goreleaser: true
      makefile: true
      ci_platforms: [ubuntu-latest, windows-latest, macos-latest]
